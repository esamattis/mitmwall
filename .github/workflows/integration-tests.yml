name: Integration tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run unit tests and type checks
        run: ./test.sh

      - name: Prepare isolated test user
        run: |
          sudo useradd --create-home --shell /bin/bash ci
          printf '%s\n' 'ci ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/ci >/dev/null
          sudo chmod 0440 /etc/sudoers.d/ci
          sudo chmod o+x /home/runner

          # The Actions agent also runs as runner and must retain unrestricted
          # egress while mitmwall filters the separate ci user. Inject this only
          # in CI because local test hosts usually have no runner account, and
          # mitmwall rejects configured bypass users that do not exist.
          sed -i 's/bypass_users = \[/bypass_users = ["runner", /' tests/integration/integration-test-config.toml

      - name: Prepare firewall backend
        run: |
          # Docker concurrently manages the host firewall and can race mitmwall's
          # OUTPUT-chain updates or hold the shared xtables lock. Neither Docker
          # nor containerd is needed after checkout, so stop them for this job.
          sudo systemctl stop docker.service docker.socket containerd.service

          # GitHub's runner image does not guarantee these netfilter modules are
          # already loaded. mitmwall needs them for NAT, redirects, owner-based
          # bypasses, connection tracking, and its managed-rule comments.
          for module in iptable_nat ip6table_nat xt_REDIRECT xt_owner xt_conntrack xt_comment; do
            sudo modprobe "$module"
          done

          # Exercise Ubuntu's default nftables-backed iptables implementation and
          # avoid depending on whichever alternative the runner image selected.
          sudo update-alternatives --set iptables /usr/sbin/iptables-nft
          sudo update-alternatives --set ip6tables /usr/sbin/ip6tables-nft

      - name: Run integration tests
        run: sudo --user ci -- ./integration_tests.sh

      - name: Show service diagnostics
        if: failure()
        run: |
          sudo systemctl --no-pager status mitmwall.service || true
          sudo journalctl --unit mitmwall.service --no-pager || true
          sudo iptables --version || true
          sudo iptables -w 10 -t nat -S || true
          sudo iptables -w 10 -t nat -C OUTPUT -p tcp -m owner ! --uid-owner mitmwall --dport 80 -j REDIRECT --to-port 58080 || true
          lsmod | grep -E 'iptable_nat|ip6table_nat|xt_REDIRECT|xt_owner' || true
          sudo iptables -w 10 -t filter -S || true
          sudo ip6tables -w 10 -t filter -S || true

      - name: Stop mitmwall
        if: always()
        run: |
          sudo systemctl stop mitmwall.service || true
          sudo /opt/mitmwall/hook.py stop || true
